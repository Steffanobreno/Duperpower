# Weekly backup of the whole database, kept off Neon, encrypted, and test-restored every time.
# Sundays 09:17 UTC (and on demand: Actions → backup → Run workflow).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL: the Neon connection string WITHOUT "-pooler" in the host (Neon → Connect →
#                        turn "Connection pooling" off → copy). pg_dump needs a direct connection.
#   BACKUP_PASSPHRASE:   a long random password. Without it the backup can't be opened: keep it in
#                        your password manager too.
# The encrypted file is kept 90 days under Actions → the run → Artifacts. To restore, see
# docs/fino-backup-restore.md. A failed run (no backup, or a backup that doesn't restore) sends
# GitHub's failure email to the repository owner.
# The Postgres tools match the server's major version (read from the database each run): pg_dump
# refuses a newer server (Neon runs 18; a fixed postgres:17 failed on 2026-11-22).
name: backup
on:
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Secrets set?
        id: ready
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URL" ] || [ -z "$PASS" ]; then echo "BACKUP_DATABASE_URL/BACKUP_PASSPHRASE not set yet, skipping"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$URL" in *-pooler*) echo "::error::BACKUP_DATABASE_URL must be the direct connection (no -pooler in the host)"; exit 1;; esac
          echo "go=yes" >> "$GITHUB_OUTPUT"

      - name: Postgres version of the database
        if: steps.ready.outputs.go == 'yes'
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          NUM=$(docker run --rm -e URL postgres:18 sh -c 'psql "$URL" -Atc "show server_version_num"')
          PG=$((NUM / 10000))
          echo "server version $NUM → tools postgres:$PG"
          echo "PG=$PG" >> "$GITHUB_ENV"

      - name: Dump the database
        if: steps.ready.outputs.go == 'yes'
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          docker run --rm -e URL postgres:$PG sh -c 'pg_dump "$URL" --format=custom --no-owner --no-acl' > fino.dump
          ls -l fino.dump
          test -s fino.dump

      - name: Restore it into an empty database and count the rows
        if: steps.ready.outputs.go == 'yes'
        env:
          PGPASSWORD: check
        run: |
          # An empty database of the same version, to prove the backup restores.
          docker run -d --name check -e POSTGRES_PASSWORD=check -p 5432:5432 postgres:$PG
          for i in $(seq 1 30); do docker exec check pg_isready -U postgres -h 127.0.0.1 && break; sleep 2; done
          docker run --rm --network host -e PGPASSWORD -v "$PWD:/b" postgres:$PG \
            pg_restore --host=127.0.0.1 --username=postgres --dbname=postgres --no-owner --no-acl --exit-on-error /b/fino.dump
          docker run --rm --network host -e PGPASSWORD postgres:$PG psql -h 127.0.0.1 -U postgres -At -c \
            "select 'businesses ' || (select count(*) from businesses) || ' · clients ' || (select count(*) from clients) || ' · visits ' || (select count(*) from appointments) || ' · migrations ' || (select count(*) from schema_migrations)" | tee counts.txt
          grep -Eq '^businesses [1-9]' counts.txt || { echo "::error::the restored copy has no businesses"; exit 1; }

      - name: Encrypt
        if: steps.ready.outputs.go == 'yes'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          echo "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "fino-$(date -u +%F).dump.gpg" fino.dump
          shred -u fino.dump
          echo "STAMP=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Keep for 90 days
        if: steps.ready.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: fino-backup-${{ env.STAMP }}
          path: |
            fino-*.dump.gpg
            counts.txt
          retention-days: 90
          if-no-files-found: error
